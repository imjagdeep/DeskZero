[package]
name = "sf-engine"
version = "0.1.0"
edition = "2021"
description = "Core filesystem organization engine for Super Folder. Pure Rust, no Tauri deps, headless-testable."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify-debouncer-full = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
