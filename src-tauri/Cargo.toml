[package]
name = "deskzero"
version = "0.4.1"
description = "Offline desktop file organizer"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "deskzero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sf-engine = { path = "crates/sf-engine" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Real app and file icons in search results.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
file_icon_provider = "1"
png = "0.17"

[workspace]
members = ["crates/sf-engine"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
