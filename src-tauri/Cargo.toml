[package]
name = "super-folder"
version = "0.1.1"
description = "Offline desktop file organizer"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "super_folder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sf-engine = { path = "crates/sf-engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"

[workspace]
members = ["crates/sf-engine"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
